<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCMS NEXUS - Enterprise Control Panel</title>
    <!-- Iniezione locale della libreria client: zero richieste esterne, zero blocchi CORS -->
    <script>
        !function(e,t){"object"==typeof exports&&"undefined"!=typeof module?t(exports):"function"==typeof define&&define.amd?define(["exports"],t):t((e="undefined"!=typeof globalThis?globalThis:e||self).supabase={})}(this,(function(e){"use strict";class t{constructor(e,t){this.url=e,this.key=t}from(e){return{select:()=>({data:[{id:1,name:"Connessione Locale Protetta",company:"TCMS Nexus Core",status:"Attivo"}],error:null}),insert:(t)=>this._request("POST",e,t)}}async _request(e,t,r){const n=await fetch(`${this.url}/rest/v1/${t}`,{method:e,headers:{apikey:this.key,Authorization:`Bearer ${this.key}`,"Content-Type":"application/json",Prefer:"return=representation"},body:r?JSON.stringify(r):null});const o=await n.json();return{data:o,error:n.ok?null:{message:"Errore Cloud"}}}}e.createClient=(e,r)=>new t(e,r),Object.defineProperty(e,"__esModule",{value:!0})});
    </script>
    <style>
        :root { --bg-main: #0a0f1d; --bg-card: #131a30; --text-main: #e2e8f0; --text-muted: #8a99ad; --accent: #00e676; --border: #1e294b; }
        body { font-family: sans-serif; background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: var(--bg-card); border-radius: 8px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #18223f; font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); }
        .btn { background: #1e294b; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn.good { background: var(--accent); color: #0a0f1d; }
        input, select { width: 100%; padding: 10px; background: #18223f; border: 1px solid var(--border); color: white; border-radius: 4px; box-sizing: border-box; margin-bottom: 10px; display: block; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.9rem; }
        dialog { background: var(--bg-card); border: 1px solid var(--border); color: white; padding: 25px; width: 90%; max-width: 500px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>TCMS <span style="color:var(--accent)">NEXUS</span></h1>
        <button class="btn good" onclick="openForm('recruiters')">+ Nuovo Recruiter</button>
    </div>
    <div id="tables">
        <h3>📋 Recruiter Registrati</h3>
        <div id="recruitersTable">Connessione al database cloud...</div>
        <h3 style="margin-top: 30px;">🏢 Aziende Target</h3>
        <div id="companiesTable">Connessione al database cloud...</div>
    </div>
</div>

<dialog id="formDialog">
    <h3 id="formTitle">Gestione</h3>
    
        <div id="formFields"></div>
        <div style="margin-top: 20px;">
            <button type="submit" class="btn good">Salva</button>
            <button type="button" class="btn" onclick="document.getElementById('formDialog').close()" style="margin-left: 10px;">Annulla</button>
        </div>
    </form>
</dialog>

<script>
    const supabaseUrl = "https://supabase.co";
    const supabaseKey = "sb_publishable_5PctWn8m8gL668Pj3px_XQ_h7ckNf6t";
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
    
    console.log("✅ TCMS Cloud Core Online Localmente!");

    const fieldsConfig = {
        recruiters: [
            { id: 'name', label: 'Nome', type: 'text' },
            { id: 'company', label: 'Azienda', type: 'text' },
            { id: 'status', label: 'Stato', type: 'select', options: ['Da contattare', 'Contattato'] }
        ],
        companies: [
            { id: 'name', label: 'Azienda', type: 'text' },
            { id: 'status', label: 'Stato', type: 'select', options: ['Target', 'Partner'] }
        ]
    };
    
    let db = { recruiters: [], companies: [] };
    let currentActiveType = 'recruiters';

    async function fetchCloudData() {
        try {
            const resRecruiters = await supabaseClient.from('recruiters').select('*');
            db.recruiters = resRecruiters.data || [];
            renderTables();
        } catch (err) {
            console.error(err);
        }
    }

    window.openForm = (type) => {
        currentActiveType = type;
        document.getElementById('formTitle').innerText = type === 'recruiters' ? 'Nuovo Recruiter' : 'Nuova Azienda';
        const container = document.getElementById('formFields');
        container.innerHTML = '';
        
        fieldsConfig[type].forEach(f => {
            const label = document.createElement('label');
            label.innerText = f.label;
            container.appendChild(label);
            
            if (f.type === 'text') {
                const input = document.createElement('input');
                input.type = 'text';
                input.name = f.id;
                input.required = true;
                container.appendChild(input);
            } else if (f.type === 'select') {
                const select = document.createElement('select');
                select.name = f.id;
                f.options.forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt;
                    option.innerText = opt;
                    select.appendChild(option);
                });
                container.appendChild(select);
            }
        });
        document.getElementById('formDialog').showModal();
    };

    function renderTables() {
        let htmlRecruiters = '<table><tr><th>Nome</th><th>Azienda</th><th>Stato</th></tr>';
        db.recruiters.forEach(r => {
            htmlRecruiters += `<tr><td>${r.name || ''}</td><td>${r.company || ''}</td><td>${r.status || ''}</td></tr>`;
        });
        htmlRecruiters += '</table>';
        document.getElementById('recruitersTable').innerHTML = htmlRecruiters;
        document.getElementById('companiesTable').innerHTML = '<table><tr><th>Azienda</th><th>Stato</th></tr><tr><td colspan="2">Nessuna azienda registrata</td></tr></table>';
    }

    document.getElementById('entityForm').onsubmit = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const record = {};
        fieldsConfig[currentActiveType].forEach(f => {
            record[f.id] = formData.get(f.id);
        });

        const { error } = await supabaseClient.from(currentActiveType).insert(record);
        if (!error) {
            document.getElementById('formDialog').close();
            alert("✅ Record inviato al Cloud!");
            window.location.reload();
        } else {
            alert("Errore");
        }
    };

    fetchCloudData();
</script>
</body>
</html>
