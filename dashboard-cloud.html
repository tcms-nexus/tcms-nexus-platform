<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCMS NEXUS - Enterprise Control Panel</title>
    <style>
        :root { --bg-main: #0a0f1d; --bg-card: #131a30; --text-main: #e2e8f0; --text-muted: #8a99ad; --accent: #00e676; --critical: #ff5252; --border: #1e294b; }
        body { font-family: sans-serif; background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 25px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: var(--bg-card); border-radius: 8px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #18223f; font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); }
        .btn { background: #1e294b; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; }
        .btn.good { background: var(--accent); color: #0a0f1d; font-weight: bold; }
        textarea, input, select { width: 100%; padding: 10px; background: #18223f; border: 1px solid var(--border); color: white; border-radius: 4px; box-sizing: border-box; margin-bottom: 10px; display: block; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.9rem; }
        dialog { background: var(--bg-card); border: 1px solid var(--border); color: white; padding: 25px; width: 90%; max-width: 500px; border-radius: 8px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>TCMS <span style="color:var(--accent)">NEXUS</span></h1>
        <button class="btn good" onclick="openForm('recruiters')">+ Nuovo Recruiter</button>
    </div>
    <div id="kpis" class="grid"></div>
    <div id="tables">
        <h3>📋 Recruiter Registrati</h3>
        <div id="recruitersTable">Inizializzazione del sistema operativo cloud...</div>
        <h3 style="margin-top: 30px;">🏢 Aziende Target</h3>
        <div id="companiesTable">Inizializzazione del sistema operativo cloud...</div>
    </div>
</div>

<dialog id="formDialog">
    <h3 id="formTitle">Gestione</h3>
    
        <div id="formFields"></div>
        <div style="margin-top: 20px;">
            <button type="submit" class="btn good">Salva</button>
            <button type="button" class="btn" onclick="document.getElementById('formDialog').close()" style="margin-left: 10px;">Annulla</button>
        </div>
    </form>
</dialog>

<!-- Cambiamo l'approccio usando un modulo nativo per evitare errori di caricamento oggetti globali -->
<script type="module">
    import { createClient } from 'https://jsdelivr.net'

    const supabaseUrl = "https://leqdagalrhwuuqitjsc.supabase.co";
    const supabaseKey = "sb_publishable_5PctWn8m8gL668Pj3px_XQ_h7ckNf6t";
    
    // Inizializzazione stabile tramite ESM
    const supabaseClient = createClient(supabaseUrl, supabaseKey);
    console.log("✅ Connessione Supabase stabilita via ESM Module nativo!");

    const fieldsConfig = {
        recruiters: [
            { id: 'name', label: 'Nome', type: 'text' },
            { id: 'company', label: 'Azienda', type: 'text' },
            { id: 'status', label: 'Stato', type: 'select', options: ['Da contattare', 'Contattato'] }
        ],
        companies: [
            { id: 'name', label: 'Azienda', type: 'text' },
            { id: 'status', label: 'Stato', type: 'select', options: ['Target', 'Partner'] }
        ]
    };
    
    let db = { recruiters: [], companies: [] };
    let currentActiveType = 'recruiters';

    async function init() {
        try {
            const resRecruiters = await supabaseClient.from('recruiters').select('*');
            db.recruiters = resRecruiters.data || [];

            const resCompanies = await supabaseClient.from('companies').select('*');
            db.companies = resCompanies.data || [];

            render();
        } catch (err) {
            console.error("Errore sincronizzazione tabelle:", err);
        }
    }

    window.openForm = (type) => {
        currentActiveType = type;
        document.getElementById('formTitle').innerText = type === 'recruiters' ? 'Nuovo Recruiter' : 'Nuova Azienda';
        
        const container = document.getElementById('formFields');
        container.innerHTML = '';
        
        fieldsConfig[type].forEach(f => {
            const label = document.createElement('label');
            label.innerText = f.label;
            container.appendChild(label);
            
            if (f.type === 'text') {
                const input = document.createElement('input');
                input.type = 'text';
                input.name = f.id;
                input.required = true;
                container.appendChild(input);
            } else if (f.type === 'select') {
                const select = document.createElement('select');
                select.name = f.id;
                f.options.forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt;
                    option.innerText = opt;
                    select.appendChild(option);
                });
                container.appendChild(select);
            }
        });
        document.getElementById('formDialog').showModal();
    };

    function render() {
        let htmlRecruiters = '<table><tr><th>Nome</th><th>Azienda</th><th>Stato</th></tr>';
        if (db.recruiters.length === 0) {
            htmlRecruiters += '<tr><td colspan="3">Nessun recruiter trovato nel database cloud</td></tr>';
        } else {
            db.recruiters.forEach(r => {
                htmlRecruiters += `<tr><td>${r.name || ''}</td><td>${r.company || ''}</td><td>${r.status || ''}</td></tr>`;
            });
        }
        htmlRecruiters += '</table>';
        document.getElementById('recruitersTable').innerHTML = htmlRecruiters;

        let htmlCompanies = '<table><tr><th>Azienda</th><th>Stato</th></tr>';
        if (db.companies.length === 0) {
            htmlCompanies += '<tr><td colspan="2">Nessuna azienda trovata nel database cloud</td></tr>';
        } else {
            db.companies.forEach(c => {
                htmlCompanies += `<tr><td>${c.name || ''}</td><td>${c.status || ''}</td></tr>`;
            });
        }
        htmlCompanies += '</table>';
        document.getElementById('companiesTable').innerHTML = htmlCompanies;
    }

    // Inizializziamo il caricamento dati al boot della pagina
    init();

    // Gestione dell'invio del modulo
    document.getElementById('entityForm').onsubmit = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const record = {};
        
        fieldsConfig[currentActiveType].forEach(f => {
            record[f.id] = formData.get(f.id);
        });

        try {
            const { error } = await supabaseClient.from(currentActiveType).insert([record]);
            if (!error) {
                document.getElementById('formDialog').close();
                await init();
            } else {
                alert("Errore Supabase durante il salvataggio: " + error.message);
            }
        } catch (err) {
            console.error(err);
        }
    };
</script>
</body>
</html>
