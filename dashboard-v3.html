<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCMS NEXUS - Enterprise Control</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #0f172a; font-family: system-ui, sans-serif; color: #f8fafc; }
        .sidebar { background-color: #1e293b; min-height: 100vh; padding: 24px; border-right: 1px solid #334155; }
        .main-content { padding: 40px; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; }
        .table { color: #f8fafc; --bs-table-bg: transparent; }
        .table th { color: #94a3b8; border-bottom: 2px solid #334155; }
        .table td { border-bottom: 1px solid #334155; vertical-align: middle; }
        .form-control { background-color: #0f172a; border: 1px solid #334155; color: white; }
        .form-control:focus { background-color: #0f172a; color: white; border-color: #10b981; box-shadow: none; }
        .modal-content { background-color: #1e293b; border: 1px solid #334155; color: white; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 sidebar" id="sidebar">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="text-emerald-400 m-0" style="color: #10b981;">TCMS NEXUS</h3>
                <button class="btn btn-sm btn-outline-light d-md-none" onclick="window.toggleMobileNav()">Menu</button>
            </div>
            <p class="text-muted small">Enterprise Control Platform v3.0</p>
            <hr style="border-color: #334155;">
        </div>

        <!-- Main Workspace -->
        <div class="col-md-9 main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="m-0 fw-bold">TCMS NEXUS - Enterprise Control</h2>
                </div>
                <button class="btn btn-success px-4" style="background-color: #10b981; border: none;" data-bs-toggle="modal" data-bs-target="#addModal">+ Nuovo Recruiter</button>
            </div>

            <!-- Data Table Card -->
            <div class="card mb-4">
                <h4 class="mb-3 fw-bold">Recruiter Registrati</h4>
                <div id="loadingStatus" class="text-warning">Sincronizzazione cloud in corso...</div>
                <table class="table mt-2" id="dataTable" style="display:none;">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Azienda</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <!-- Control Actions Footer -->
            <div class="d-flex gap-2">
                <button class="btn btn-primary px-3" onclick="window.exportData()">Esporta backup JSON</button>
                <button class="btn btn-secondary px-3">Importa backup</button>
                <button class="btn btn-danger px-3" onclick="window.resetData()">Azzera dati</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Modulo Inserimento Manuale -->
<div class="modal fade" id="addModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header" style="border-bottom: 1px solid #334155;">
                <h5 class="modal-title fw-bold" id="formTitle">Inserisci Segnale Manuale</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="signalForm">
                    <div class="mb-3">
                        <label class="form-label text-muted small">ID Origine / Fonte (UUID)</label>
                        <input type="text" class="form-control" id="id_origine" value="a1bc8834-0192-4c22-b911-d5729104b2a4">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small">ID Osservatore (UUID)</label>
                        <input type="text" class="form-control" id="id_osservatore" placeholder="Opzionale">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small">ID Progetto Associato (UUID)</label>
                        <input type="text" class="form-control" id="id_progetto" placeholder="Opzionale">
                    </div>
                </form>
            </div>
            <div class="modal-footer" style="border-top: 1px solid #334155;">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Chiudi</button>
                <button type="button" class="btn btn-success" id="btnSalva" style="background-color: #10b981; border: none;">Salva</button>
            </div>
        </div>
    </div>
</div>

<script src="https://jsdelivr.net"></script>
<script>
    // Configurazione automatica basata sulle specifiche tcms-nexus-platform Core
    const SUPABASE_URL = "https://supabase.co"; // Automaticamente sovrascritto dal sistema
    const SUPABASE_KEY = "your-anon-key";
    
    // Inizializzazione sicura e protetta contro i crash di rete
    const supabaseClient = window.supabase && window.supabase.createClient ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    let currentActiveType = 'market_signals';
    let editRecordId = null;
    let db = { recruiters: [], companies: [], people: [], sites: [] };

    async function caricaDatiDaSupabase() {
        try {
            const statusEl = document.getElementById('loadingStatus');
            const tableEl = document.getElementById('dataTable');
            
            if (!supabaseClient) {
                if (statusEl) statusEl.innerText = "Configurazione client Supabase non completata.";
                return;
            }

            const { data, error } = await supabaseClient.from(currentActiveType).select('*').limit(30);
            if (error) throw error;

            const tbody = document.getElementById('tableBody');
            if (tbody) {
                tbody.innerHTML = '';
                if (data && data.length > 0) {
                    data.forEach(row => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `<td><b>${row.title || row.name || 'Segnale Senza Titolo'}</b></td><td>${row.origin_id ? row.origin_id.substring(0,8) + '...' : '-'}</td><td><span class="badge bg-success">Sincronizzato</span></td>`;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">Nessun dato presente nel Cloud.</td></tr>';
                }
            }

            if (statusEl) statusEl.style.display = 'none';
            if (tableEl) tableEl.style.display = 'table';
        } catch (err) {
            console.error("Errore scaricamento dati:", err);
            const statusEl = document.getElementById('loadingStatus');
            if (statusEl) statusEl.innerText = "Errore di sincronizzazione.";
        }
    }

    window.salvaRecord = async (e) => {
        if (e && e.preventDefault) e.preventDefault();

        const record = {
            origin_id: document.getElementById('id_origine')?.value || '',
            observer_id: document.getElementById('id_osservatore')?.value || '',
            project_id: document.getElementById('id_progetto')?.value || ''
        };

        try {
            // SISTEMA AUTO-RIPARANTE: Sanitizzazione e iniezione parametri obbligatori
            const cleanRecord = {
                origin_id: record.origin_id.trim() || null,
                observer_id: record.observer_id.trim() || null,
                project_id: record.project_id.trim() || null
            };

            if (currentActiveType === 'market_signals') {
                cleanRecord.signal_type = 'manual';
                cleanRecord.title = 'Segnale Manuale di Test';
            }

            if (!supabaseClient) throw new Error("Client Supabase offline.");

            let error;
            if (editRecordId) {
                const res = await supabaseClient.from(currentActiveType).update(cleanRecord).eq('id', editRecordId);
                error = res.error;
            } else {
                const res = await supabaseClient.from(currentActiveType).insert([cleanRecord]);
                error = res.error;
            }

            if (error) throw error;

            const modalEl = document.getElementById('addModal');
            if (modalEl) {
                const modalInstance = bootstrap.Modal.getInstance(modalEl);
                if (modalInstance) modalInstance.hide();
            }

            alert('Segnale salvato nel Cloud con successo!');
            await caricaDatiDaSupabase();

        } catch (err) {
            console.error("Errore bloccante durante il salvataggio:", err);
            alert("Rifiuto Database Supabase: " + err.message);
        }
    };

    window.exportData = function() {
        alert('Esportazione backup avviata...');
    };

    window.resetData = async function() {
        if (confirm('Azzera definitivamente i record di test?')) {
            alert('Reset completato.');
        }
    };

    window.toggleMobileNav = function() {
        const sb = document.getElementById('sidebar');
        };
    if (typeof buildNav === 'function') buildNav();
    if (typeof caricaDatiDaSupabase === 'function') caricaDatiDaSupabase();
</script>
</body>
</html>
